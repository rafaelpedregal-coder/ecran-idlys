<!DOCTYPE html>
<html lang="fr">
<head>

<title>iD.LYS Contrôles – écran d’accueil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* Charte iD.LYS Contrôles — tokens repris du design system iD.LYS */
  :root {
    --controles: #157ec2;        /* bleu Contrôles (texte ≥ 24 px) */
    --controles-text: #0a6aa0;   /* bleu pour petits textes */
    --voile: #eaf3fa;            /* voile bleu clair */
    --noir: #1b1b1c;
    --texte: #4a4a4f;
    --texte-2: #6e6e77;
    --creme: #f7f6f4;
    --blanc: #ffffff;
    --filet: #d9d9d9;
    --u: min(1vw, 1.7778vh);     /* 1 unité = 1/100 de la largeur d’un écran 16:9 */
    color-scheme: light;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--blanc); color: var(--noir);
    font-family: "DIN Pro", Barlow, Arial, sans-serif;
    overflow: hidden; cursor: none;
    -webkit-font-smoothing: antialiased;
  }
  .stage { position: relative; height: 100%; overflow: hidden; }
  .slide {
    position: absolute; inset: 0; overflow: hidden;
    opacity: 0; transition: opacity 1.2s ease;
  }
  .slide.on { opacity: 1; }
  .creme { background: var(--creme); }

  /* Puce de marque : trois barres bleues */
  .kicker {
    display: flex; align-items: center; gap: calc(var(--u) * 1.1);
    font-weight: 700; font-size: calc(var(--u) * 1.6); letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--controles-text);
  }
  .puce { display: flex; align-items: flex-end; gap: calc(var(--u) * 0.22); }
  .puce i { display: block; width: calc(var(--u) * 0.33); border-radius: 99px; background: var(--controles); }
  .puce i:nth-child(1) { height: calc(var(--u) * 0.6); }
  .puce i:nth-child(2) { height: calc(var(--u) * 1.1); }
  .puce i:nth-child(3) { height: calc(var(--u) * 0.85); }

  h1, h2 { margin: 0; font-weight: 900; line-height: 1.02; letter-spacing: -0.01em; }
  .bleu { color: var(--controles); }

  /* 1. Page de garde : fond blanc, logo seul */
  .brand { background: var(--blanc); display: flex; align-items: center; justify-content: center; }
  .brand .bloc { display: flex; align-items: center; justify-content: center; }
  .brand .logo { width: calc(var(--u) * 58); display: block; }

  /* 2. Date + fête */
  .today .gauche {
    position: absolute; left: calc(var(--u) * 8); top: 0; bottom: 0; width: calc(var(--u) * 52);
    display: flex; flex-direction: column; justify-content: center;
  }
  .today h1 { font-size: calc(var(--u) * 7.4); margin: calc(var(--u) * 2) 0 calc(var(--u) * 3.6); }
  .today .fete {
    background: var(--voile); border-radius: 0 0 0 calc(var(--u) * 5);
    padding: calc(var(--u) * 2.6) calc(var(--u) * 3);
    font-size: calc(var(--u) * 2.5); color: var(--noir); line-height: 1.35;
  }
  .today .fete strong { font-weight: 900; color: var(--controles); }
  .today .fete:empty { display: none; }
  .today .bloc-bleu {
    position: absolute; right: 0; top: calc(var(--u) * 7); bottom: calc(var(--u) * 7);
    width: calc(var(--u) * 30);
    background: var(--controles); color: var(--blanc);
    border-radius: 0 calc(var(--u) * 7) 0 0;
    display: flex; flex-direction: column; justify-content: center; padding-left: calc(var(--u) * 4);
  }
  .today .heure { font-weight: 900; font-size: calc(var(--u) * 9); line-height: 1; font-variant-numeric: tabular-nums; }
  .today .legende { font-weight: 500; font-size: calc(var(--u) * 1.7); letter-spacing: 0.14em; text-transform: uppercase; margin-top: calc(var(--u) * 1.4); }

  /* 3. Messages, anniversaires, veille */
  .texte .contenu {
    position: absolute; left: calc(var(--u) * 8); right: calc(var(--u) * 8); top: 0; bottom: calc(var(--u) * 6);
    display: flex; flex-direction: column; justify-content: center;
  }
  .texte h2 { font-size: calc(var(--u) * 5.6); max-width: 24ch; margin: calc(var(--u) * 2.2) 0 calc(var(--u) * 2.6); }
  .texte p { margin: 0; font-size: calc(var(--u) * 2.4); line-height: 1.45; color: var(--texte); max-width: 52ch; }
  .texte .source { margin-top: calc(var(--u) * 2.4); font-size: calc(var(--u) * 1.6); font-weight: 500; color: var(--texte-2); }
  .texte .carte {
    background: var(--blanc); border-top: calc(var(--u) * 0.3) solid var(--controles);
    padding: calc(var(--u) * 3) calc(var(--u) * 3.4); max-width: calc(var(--u) * 70);
  }
  .noms { font-size: calc(var(--u) * 6.4); font-weight: 900; color: var(--controles); line-height: 1.1; }
  /* Gâteau d’anniversaire */
  .anniv .contenu > :not(.gateau) { max-width: 52%; }
  .gateau { position: absolute; right: 0; top: 50%; transform: translateY(-50%); height: calc(var(--u) * 36); }
  .gateau .assiette { fill: var(--filet); }
  .gateau .etage1 { fill: var(--controles); }
  .gateau .etage2 { fill: #8abee0; }
  .gateau .glacage, .gateau .glacage2 { fill: var(--blanc); }
  .gateau .bougies rect { fill: var(--voile); stroke: var(--controles); stroke-width: 3; }
  .gateau .flammes path { fill: #f2b233; transform-box: fill-box; transform-origin: 50% 100%; animation: flamme 1.4s ease-in-out infinite alternate; }
  .gateau .flammes path:nth-child(2) { animation-delay: .4s; }
  .gateau .flammes path:nth-child(3) { animation-delay: .8s; }
  .gateau .confettis * { fill: var(--controles); opacity: .35; }
  @keyframes flamme { from { transform: scale(1, 1); } to { transform: scale(.85, 1.15); } }

  /* Pied : pictogramme, filet de progression, heure */
  .foot {
    position: absolute; left: calc(var(--u) * 8); right: calc(var(--u) * 8); bottom: calc(var(--u) * 3);
    display: flex; align-items: center; gap: calc(var(--u) * 2);
    transition: opacity 1.2s ease;
  }
  .foot.cache { opacity: 0; }
  .foot .picto { height: calc(var(--u) * 2); display: block; }
  .bar { flex: 1; height: 2px; background: var(--filet); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--controles); }
  .clock { font-weight: 700; font-size: calc(var(--u) * 1.6); color: var(--noir); font-variant-numeric: tabular-nums; }

  /* 4. Veille réglementaire */
  .veille .carte { margin-top: calc(var(--u) * 2); }
  .veille .carte h2 { font-size: calc(var(--u) * 4.2); max-width: 30ch; margin: calc(var(--u) * 1.4) 0 calc(var(--u) * 2); }
  .veille .carte p { font-size: calc(var(--u) * 2.2); max-width: 62ch; }
  .statut {
    display: inline-block; font-weight: 700; font-size: calc(var(--u) * 1.3); letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--controles-text); background: var(--voile); padding: calc(var(--u) * 0.5) calc(var(--u) * 1);
  }
  .compteur { margin-left: auto; font-weight: 500; letter-spacing: 0.08em; color: var(--texte-2); }

  /* 5. Moments de sympathie */
  .moment { background: var(--controles); color: var(--blanc); }
  .moment .kicker { color: var(--blanc); }
  .moment .puce i { background: var(--blanc); }
  .moment h2 { font-size: calc(var(--u) * 8); max-width: 16ch; color: var(--blanc); }
  .moment h2 .clair { color: var(--voile); font-weight: 500; }
  .moment p { color: var(--blanc); font-size: calc(var(--u) * 2.6); max-width: 44ch; }
  .moment .contenu { bottom: 0; z-index: 1; }
  .deco { position: absolute; inset: 0; pointer-events: none; }
  .deco i { position: absolute; display: block; border-radius: 50%; background: var(--blanc); opacity: 0.16; }
  .deco.ete i:first-child { opacity: 0.22; }
  .deco.annee i { border-radius: 99px; }

  @media (prefers-reduced-motion: reduce) { .slide, .foot { transition: none; } .gateau .flammes path { animation: none; } }
</style>
</head>

const DUREE = 12000; // durée d’affichage de chaque écran, en millisecondes

/* ===================== Fin de la partie à modifier ===================== */

const pad = n => String(n).padStart(2, "0");
const auj = new Date();
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const cleJour = pad(auj.getMonth() + 1) + "-" + pad(auj.getDate());
const ajout15 = s => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + 14); return iso(d); };
const actif = e => iso(auj) >= e.du && iso(auj) <= (e.au || ajout15(e.du));
const esc = s => String(s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const puce = '<span class="puce"><i></i><i></i><i></i></span>';
const stage = document.getElementById("stage");
const foot = document.getElementById("foot");

function ajouterSlide(html, classe) {
  const s = document.createElement("section");
  s.className = "slide texte " + (classe || "");
  s.innerHTML = '<div class="contenu">' + html + "</div>";
  stage.insertBefore(s, foot);
}

// Anniversaires du jour
const annivs = ANNIVERSAIRES.filter(a => a.jour === cleJour).map(a => esc(a.prenom));
if (annivs.length) {
  ajouterSlide(
    '<div class="kicker">' + puce + "Anniversaire</div>" +
    "<h2>Joyeux anniversaire</h2>" +
    '<div class="noms">' + annivs.join(" · ") + "</div>" +
    '<svg class="gateau" viewBox="0 0 320 320" aria-hidden="true"><g class="confettis"><rect x="28" y="70" width="8" height="18" rx="4" transform="rotate(-25 32 79)"/><rect x="280" y="52" width="8" height="18" rx="4" transform="rotate(30 284 61)"/><rect x="52" y="190" width="8" height="18" rx="4" transform="rotate(40 56 199)"/><rect x="262" y="176" width="8" height="18" rx="4" transform="rotate(-35 266 185)"/><circle cx="70" cy="40" r="6"/><circle cx="250" cy="120" r="5"/><circle cx="20" cy="140" r="5"/><circle cx="300" cy="230" r="6"/></g><ellipse cx="160" cy="290" rx="130" ry="16" class="assiette"/><rect x="50" y="200" width="220" height="84" rx="14" class="etage1"/><path d="M50 214 q0-14 14-14 h192 q14 0 14 14 v10 q-12 14-24 0 q-12 14-24 0 q-12 14-24 0 q-12 14-24 0 q-12 14-24 0 q-12 14-24 0 q-12 14-24 0 q-12 14-24 0 q-12 14-24 0z" class="glacage"/><rect x="86" y="140" width="148" height="66" rx="12" class="etage2"/><path d="M86 152 q0-12 12-12 h124 q12 0 12 12 v8 q-10 12-21 0 q-10 12-21 0 q-10 12-21 0 q-10 12-21 0 q-10 12-21 0 q-10 12-21 0 q-10 12-22 0z" class="glacage2"/><g class="bougies"><rect x="112" y="92" width="12" height="50" rx="4"/><rect x="154" y="84" width="12" height="58" rx="4"/><rect x="196" y="92" width="12" height="50" rx="4"/></g><g class="flammes"><path d="M118 70 q10 14 0 22 q-10-8 0-22z"/><path d="M160 62 q10 14 0 22 q-10-8 0-22z"/><path d="M202 70 q10 14 0 22 q-10-8 0-22z"/></g></svg>', "creme anniv");

// Moments de sympathie en cours
const enCours = m => m.du.length === 5 ? (cleJour >= m.du && cleJour <= m.au) : (iso(auj) >= m.du && iso(auj) <= m.au);
const decor = { noel: 14, annee: 18, ete: 1, rentree: 6 };
MOMENTS.filter(enCours).forEach(m => {
  const s = document.createElement("section");
  s.className = "slide texte moment";
  s.dataset.type = "moment";
  let d = '<div class="deco ' + m.theme + '">';
  for (let k = 0; k < (decor[m.theme] || 8); k++) {
    let st;
    if (m.theme === "ete") st = "width:calc(var(--u)*36);height:calc(var(--u)*36);right:calc(var(--u)*-12);top:calc(var(--u)*-14)";
    else if (m.theme === "annee") st = "width:calc(var(--u)*0.6);height:calc(var(--u)*" + (2 + (k * 7) % 4) + ");right:" + (2 + ((k * 0.618) % 1) * 22).toFixed(1) + "%;top:" + (6 + ((k * 0.7549 + 0.2) % 1) * 86).toFixed(1) + "%;transform:rotate(" + (k * 47 % 180) + "deg)";
    else { const t = 1 + (k * 13) % 4; st = "width:calc(var(--u)*" + t + ");height:calc(var(--u)*" + t + ");right:" + (2 + ((k * 0.618) % 1) * 24).toFixed(1) + "%;top:" + (5 + ((k * 0.7549 + 0.1) % 1) * 88).toFixed(1) + "%"; }
    d += '<i style="' + st + '"></i>';
  }
  d += "</div>";
  s.innerHTML = d + '<div class="contenu"><div class="kicker">' + puce + esc(m.rubrique) + "</div>" +
    "<h2>" + esc(m.titre.replace("{annee}", auj.getFullYear())) + (m.titreBleu ? ' <span class="clair">' + esc(m.titreBleu) + "</span>" : "") + "</h2>" +
    (m.texte ? "<p>" + esc(m.texte) + "</p>" : "") + "</div>";
  stage.insertBefore(s, foot);
});

// Informations internes en cours
MESSAGES.filter(actif).forEach(m => ajouterSlide(
  '<div class="kicker">' + puce + esc(m.rubrique || "Information interne") + "</div>" +
  "<h2>" + esc(m.titre) + (m.titreBleu ? ' <span class="bleu">' + esc(m.titreBleu) + "</span>" : "") + "</h2>" +
  (m.texte ? "<p>" + esc(m.texte) + "</p>" : ""), "creme"));

// Veille réglementaire en cours : un écran par actualité
const veille = VEILLE.filter(actif);
veille.forEach((v, k) => ajouterSlide(
  '<div class="kicker">' + puce + "Veille réglementaire" + (veille.length > 1 ? '<span class="compteur">' + (k + 1) + " / " + veille.length + "</span>" : "") + "</div>" +
  '<div class="carte">' + (v.statut ? '<span class="statut">' + esc(v.statut) + "</span>" : "") +
  "<h2>" + esc(v.titre) + (v.titreBleu ? ' <span class="bleu">' + esc(v.titreBleu) + "</span>" : "") + "</h2>" +
  (v.texte ? "<p>" + esc(v.texte) + "</p>" : "") +
  (v.source ? '<div class="source">Source : ' + esc(v.source) + "</div>" : "") + "</div>", "creme veille"));

// Date et fête
function majDate() {
  const d = new Date();
  const js = d.toLocaleDateString("fr-FR", { weekday: "long" });
  document.getElementById("jourSemaine").textContent = js.charAt(0).toUpperCase() + js.slice(1);
  document.getElementById("jourDate").textContent = d.toLocaleDateString("fr-FR", { day: "numeric", month: "long" });
  const f = FETES[pad(d.getMonth() + 1) + "-" + pad(d.getDate())];
  document.getElementById("fete").innerHTML = f
    ? "Nous souhaitons une bonne fête<br>aux <strong>" + esc(f) + "</strong>" : "";
}
function majHeure() {
  const h = new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  document.getElementById("clock").textContent = h;
  document.getElementById("heureGrande").textContent = h;
}

// Défilement
const slides = [...document.querySelectorAll(".slide")];
const prog = document.getElementById("prog");
let i = 0;
function lancerBarre() {
  prog.style.transition = "none"; prog.style.width = "0";
  requestAnimationFrame(() => requestAnimationFrame(() => {
    prog.style.transition = "width " + DUREE + "ms linear"; prog.style.width = "100%";
  }));
}
function afficher() {
  foot.classList.toggle("cache", ["logo", "jour", "moment"].includes(slides[i].dataset.type));
  lancerBarre();
}
function suivant() {
  slides[i].classList.remove("on");
  i = (i + 1) % slides.length;
  slides[i].classList.add("on");
  majDate();
  afficher();
}

majDate(); majHeure(); afficher();
setInterval(suivant, DUREE);
setInterval(majHeure, 10000);
// Rechargement toutes les heures pour récupérer les mises à jour publiées sur GitHub
setInterval(() => location.reload(), 3600000);
</script>
